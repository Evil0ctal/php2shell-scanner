# ============================================================================
# php2shell - ModSecurity Rules
# CVE-2026-109618 / CVE-2026-109619  ("php2shell")
#
# Compatible with ModSecurity v2/v3 and libmodsecurity.
# Place in your modsecurity conf directory or Include it from modsecurity.conf.
#
# Rule ID range: 9900100 - 9900119
#
# Ported into php2shell-scanner from:
#   - ikow/php2shell-poc                 detection/modsecurity.conf (base rules)
#   - dinosn/php-cve-2026-10961x-lab-poc docs/WAF-BYPASS.md         (bypass hardening)
# and extended by the php2shell-scanner project (Evil0ctal).
#
# HARDENING vs the comma/space Content-Type bypass (dinosn, verified):
#   PHP trims the media type at ';', ',' AND space, so the multipart gate must
#   match that whole separator class, not just "; boundary=". Every rule below
#   that keys on the Content-Type uses:
#       @rx ^[[:space:]]*multipart/form-data([;,[:space:]]|$)
#   which is the one public form proven NOT evadable by the comma variant.
# ============================================================================

# --- Rule 9900100: Block PHP_SESSION_UPLOAD_PROGRESS in a multipart body ---
# Primary attack trigger for both CVEs. Near-zero legitimate use. Method-agnostic
# because PHP 8.4 request_parse_body() parses multipart on non-POST methods too.
SecRule REQUEST_HEADERS:Content-Type "@rx ^[[:space:]]*multipart/form-data([;,[:space:]]|$)" \
    "id:9900100, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS in request body', \
    tag:'CVE-2026-109618', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_BODY|REQUEST_BODY_LENGTH|FILES_NAMES|ARGS_NAMES "@contains PHP_SESSION_UPLOAD_PROGRESS"

# --- Rule 9900101: Detect PHPSESSID in a multipart body (session fixation) ---
# Alert only - some legacy apps may legitimately post a session id.
SecRule REQUEST_HEADERS:Content-Type "@rx ^[[:space:]]*multipart/form-data([;,[:space:]]|$)" \
    "id:9900101, \
    phase:2, \
    log, \
    noauditlog, \
    pass, \
    msg:'php2shell: PHPSESSID in POST body (session fixation indicator)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'WARNING', \
    chain"
    SecRule REQUEST_BODY|ARGS_NAMES "@rx name=[\"']?PHPSESSID[\"']?"

# --- Rule 9900102: Block PHP code in upload filenames (session injection) ---
SecRule MULTIPART_FILENAME "@rx <\?(?:php|=)" \
    "id:9900102, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: PHP code in upload filename', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900103: Block serialized PHP objects in upload filenames ---
# Handler-mismatch (Chain C): pipe + serialized object in the filename.
SecRule MULTIPART_FILENAME "@rx \|[OaCr]:\d+:" \
    "id:9900103, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: serialized PHP object in upload filename', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900104: Detect PHP OOM in the response (exploitation indicator) ---
SecRule RESPONSE_BODY "@rx Allowed memory size.{1,50}exhausted" \
    "id:9900104, \
    phase:4, \
    log, \
    pass, \
    msg:'php2shell: PHP OOM detected in response (possible exploitation)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'HIGH'"

# --- Rule 9900105: Detect session destruction failure in the response ---
SecRule RESPONSE_BODY "@contains Session object destruction failed" \
    "id:9900105, \
    phase:4, \
    log, \
    pass, \
    msg:'php2shell: session destruction failure (stale state exploitation)', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900106: Block chunked multipart POST (OOM / post_max_size bypass) ---
# Missing Content-Length on multipart skips PHP's post_max_size pre-check.
SecRule REQUEST_HEADERS:Content-Type "@rx ^[[:space:]]*multipart/form-data([;,[:space:]]|$)" \
    "id:9900106, \
    phase:1, \
    deny, \
    status:400, \
    log, \
    msg:'php2shell: chunked multipart request (post_max_size bypass)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'HIGH', \
    chain"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@contains chunked"

# --- Rule 9900107: Non-standard multipart Content-Type separator (WAF bypass) ---
# Flags the comma/space separator variant itself; by the time 9900100 matches
# this one has already recorded the evasion attempt.
SecRule REQUEST_HEADERS:Content-Type \
    "@rx ^[[:space:]]*multipart/form-data[[:space:]]*(?:,[[:space:]]*|[[:space:]]+)boundary=" \
    "id:9900107, \
    phase:1, \
    log, \
    pass, \
    msg:'php2shell: multipart Content-Type with non-standard separator (WAF-signature bypass)', \
    tag:'CVE-2026-109618', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'WARNING'"

# --- Rule 9900108: Heap-leak PHPSESSID in a response Set-Cookie header ---
SecRule RESPONSE_HEADERS:Set-Cookie "@rx PHPSESSID=[A-Za-z0-9,%-]{64,}" \
    "id:9900108, \
    phase:3, \
    log, \
    pass, \
    msg:'php2shell: abnormally long PHPSESSID issued (heap memory leak)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL'"
