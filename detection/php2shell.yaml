# ============================================================================
# php2shell - Sigma Detection Rules
# CVE-2026-109618 / CVE-2026-109619
#
# Log-based detection for web server logs and host-level events.
# Compatible with Sigma-compatible SIEMs (Splunk, Elastic, Sentinel, etc.)
#
# Ported into php2shell-scanner from ikow/php2shell-poc detection/php2shell.yaml,
# with hardening from dinosn/php-cve-2026-10961x-lab-poc docs/WAF-BYPASS.md
# (method de-anchoring + Content-Type separator rule) by the php2shell-scanner
# project (Evil0ctal).
# ============================================================================

---
title: php2shell Exploitation Attempt via Upload Progress
id: a1f2e3d4-5678-9abc-def0-php2shell001
status: experimental
description: >
  Detects HTTP requests to PHP endpoints containing
  PHP_SESSION_UPLOAD_PROGRESS in the request body. This is the primary
  trigger for CVE-2026-109618 and CVE-2026-109619. Legitimate use of
  this PHP feature is extremely rare in modern applications. The method
  filter is intentionally absent: PHP 8.4 request_parse_body() parses
  multipart/form-data on GET/PUT/PATCH/DELETE as well as POST.
author: Qi Deng (@ikow); hardened by php2shell-scanner
date: 2026-10-21
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://github.com/ikow/php2shell-poc
  - https://github.com/dinosn/php-cve-2026-10961x-lab-poc
logsource:
  category: webserver
detection:
  selection:
    cs-uri|endswith: '.php'
  keywords:
    - 'PHP_SESSION_UPLOAD_PROGRESS'
  condition: selection and keywords
level: high
falsepositives:
  - Legacy PHP applications that still use server-side upload progress tracking
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026.109618
  - cve.2026.109619

---
title: php2shell Multipart Content-Type Separator Bypass
id: a1f2e3d4-5678-9abc-def0-php2shell006
status: experimental
description: >
  Detects a multipart/form-data Content-Type that uses a comma or bare space
  instead of a semicolon before the boundary parameter. PHP's SAPI parser
  accepts all three separators, so this variant parses normally while slipping
  past every WAF/IDS signature anchored on "; boundary=". The non-standard
  separator is itself an evasion fingerprint. Requires the Content-Type header
  to be captured in logs (e.g. ModSecurity audit log, custom log_format).
author: dinosn; ported by php2shell-scanner
date: 2026-10-21
references:
  - https://github.com/dinosn/php-cve-2026-10961x-lab-poc
logsource:
  category: webserver
detection:
  selection_ct:
    cs-content-type|re: 'multipart/form-data(?:\s*,\s*|\s+)boundary='
  condition: selection_ct
level: high
falsepositives:
  - Rare non-compliant HTTP clients that emit a comma separator legitimately
tags:
  - attack.defense_evasion
  - attack.t1190
  - cve.2026.109618
  - cve.2026.109619

---
title: php2shell OOM Exploitation via Oversized Multipart Request
id: a1f2e3d4-5678-9abc-def0-php2shell002
status: experimental
description: >
  Detects large multipart requests to PHP endpoints that result in server
  errors. The OOM corruption path (CVE-2026-109618) amplifies ~52x via
  duplicate short part-headers, so a body well under post_max_size can still
  exhaust memory_limit.
author: Qi Deng (@ikow)
date: 2026-10-21
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/ikow/php2shell-poc
  - https://github.com/dinosn/php-cve-2026-10961x-lab-poc
logsource:
  category: webserver
detection:
  selection:
    cs-uri|endswith: '.php'
    sc-status:
      - 500
      - 502
      - 503
  filter_size:
    cs-bytes|gte: 100000
  condition: selection and filter_size
level: medium
falsepositives:
  - Large legitimate uploads that fail for other reasons
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026.109618

---
title: php2shell Post-Exploitation - Shell Spawned by PHP Process
id: a1f2e3d4-5678-9abc-def0-php2shell003
status: experimental
description: >
  Detects a shell or scripting interpreter spawned as a child of a PHP
  process (php-fpm, php-cgi, apache2, httpd). This behaviour-based signal is
  unaffected by any request-side WAF bypass and indicates successful code
  execution following php2shell exploitation.
author: Qi Deng (@ikow)
date: 2026-10-21
references:
  - https://github.com/ikow/php2shell-poc
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '/php-fpm'
      - '/php-cgi'
      - '/php'
      - '/apache2'
      - '/httpd'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/python'
      - '/python3'
      - '/perl'
      - '/ruby'
      - '/nc'
      - '/ncat'
      - '/curl'
      - '/wget'
  condition: selection_parent and selection_child
level: critical
falsepositives:
  - PHP applications that legitimately exec shell commands (cron jobs, image processing)
tags:
  - attack.execution
  - attack.t1059
  - cve.2026.109618
  - cve.2026.109619

---
title: php2shell Session File Poisoning
id: a1f2e3d4-5678-9abc-def0-php2shell004
status: experimental
description: >
  Detects PHP code written into session files on disk. The session injection
  attack stores PHP code in the session file via the upload filename, then
  includes it via LFI for code execution. This path survives the 8.5.12 patch.
author: Qi Deng (@ikow)
date: 2026-10-21
references:
  - https://github.com/ikow/php2shell-poc
logsource:
  product: linux
  category: file_event
detection:
  selection_path:
    TargetFilename|contains:
      - '/sessions/sess_'
      - '/php/sessions/sess_'
      - '/tmp/sess_'
  keywords_in_file:
    - '<?php'
    - 'system('
    - 'eval('
    - 'exec('
    - 'passthru('
    - 'shell_exec('
  condition: selection_path and keywords_in_file
level: critical
falsepositives:
  - Very unlikely - PHP code should never appear in session files
tags:
  - attack.persistence
  - attack.t1505
  - cve.2026.109618

---
title: php2shell PHP OOM Fatal Error in Logs
id: a1f2e3d4-5678-9abc-def0-php2shell005
status: experimental
description: >
  Detects PHP out-of-memory fatal errors raised in the SAPI (not user code).
  "in Unknown on line 0" confirms the OOM happened during SAPI multipart
  parsing. Repeated OOM errors on PHP endpoints receiving multipart requests
  indicate CVE-2026-109618 OOM exploitation attempts.
author: Qi Deng (@ikow)
date: 2026-10-21
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
logsource:
  product: php
  category: application
detection:
  keywords:
    - 'Allowed memory size'
  selection_sapi:
    - 'in Unknown on line 0'
  condition: keywords and selection_sapi
level: medium
falsepositives:
  - Legitimate PHP scripts that exhaust memory inside user code (these report a real file/line)
tags:
  - attack.initial_access
  - cve.2026.109618
